<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with confirmation</title>
    <style>

        h1 {
            font-family:monospace;
        }
        .form-group-element {
            max-width: 500px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .error-message{
            color: brown;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Field Validation in JavaScript</h1>

    <form id="standard-form">
        <div class="form-group-element">
            <label for="name-input">Name:</label>
            <input id="name-input" type="text" name= "Name" class="mandatory">
            <span class="error-message">Mandatory field</span>
        </div>
        <div class="form-group-element">
            <label for="email-input">E-mail:</label>
            <input id="email-input" type="email" name="E-mail" class="mandatory">
            <span class="error-message">Mandatory field</span>
        </div>
        <div class="form-group-element">
            <label for="password-input">Password:</label>
            <input id="password-input" type="password" name="Password" class="mandatory">
            <span class="error-message">Mandatory field</span>
        </div>
        <div class="form-group-element">
            <label for="password-input-confirmation">Confirm:</label>
            <input id="password-input-confirmation"type="password" name="Confirm password" class="mandatory">
            <span class="error-message">Mandatory field</span>
        </div>

        <input type="submit">
    </form>
    <script src="script-form.js"></script>
</body>
</html>
